<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Uday Cherri</title>
    <!--
      GitHub Pages SPA fallback. Pages serves this file for any unknown path
      (e.g. a deep link like /security/blog/foo refreshed directly). It rewrites
      the URL into a form index.html can restore, then redirects there.
      Technique: https://github.com/rafgraph/spa-github-pages  (MIT)
    -->
    <script type="text/javascript">
      var pathSegmentsToKeep = 0; // user site served at domain root
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
